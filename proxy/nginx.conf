# Punto de entrada unico del stack. Todo lo demas (backend, identity-broker,
# frontend, n8n, postgres, ollama) deja de publicar puertos al host -- solo
# se alcanzan entre si por la red interna mailingai_internal. Este es el
# UNICO servicio con un mapeo de puerto al host (ver docker-compose.yml).

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Headers de seguridad basicos (hallazgo de deuda de arquitectura,
    # docs/AUDIT_2026-08-19.md) -- defensa en profundidad, no la causa raiz de
    # C1/C2 (ya corregidos en el codigo), pero acota el impacto de cualquier
    # XSS que aparezca a futuro. `always` para que tambien viajen en
    # respuestas de error (4xx/5xx).
    #
    # style-src permite 'unsafe-inline' porque el frontend usa el prop style=
    # de React ampliamente (no hay forma practica de nonce-ar cada uno); todo
    # el JS de la app es externo (self), asi que script-src NO necesita
    # 'unsafe-inline' -- ver identity-broker/app/main.py (oauth_callback_script)
    # para el unico lugar donde eso importaba de verdad.
    # frame-src incluye blob: porque AttachmentItem.tsx previsualiza adjuntos
    # en un iframe apuntando a una blob: URL generada en el propio navegador.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Backend (API + callback SSO de login). El prefijo /api/ se preserva tal
    # cual -- backend ya espera sus rutas bajo /api/... (ver backend/app/main.py).
    #
    # proxy_read_timeout en 150s (default de nginx es 60s): las rutas de IA
    # (analisis de expediente, pregunta-respuesta) esperan la respuesta de
    # Ollama con un timeout propio de 120s (ver ollama_provider.py) -- con el
    # default de 60s, nginx cortaba la conexion con un 504 generico antes de
    # que el backend llegara a responder (exito o el mensaje de error real).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generacion de graficos (normalmente server-to-server, n8n -> backend
    # interno -- se deja tambien proxiado para poder probarlo a mano igual
    # que documenta el README).
    location /charts/ {
        proxy_pass http://backend:8000/charts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # identity-broker: SOLO el flujo OAuth2 publico (/oauth/microsoft/start y
    # /oauth/microsoft/callback). Deliberadamente no se mapea nada de
    # /internal/* -- esas rutas no tienen autenticacion propia y solo deben
    # ser alcanzables desde la red interna (las usa el backend via
    # IDENTITY_BROKER_URL=http://identity-broker:8000).
    location /identity/oauth/ {
        proxy_pass http://identity-broker:8000/oauth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # n8n: editor de workflows, solo para administracion. Protegido con
    # Basic Auth ademas del login propio de n8n -- generar
    # proxy/.htpasswd antes de levantar este servicio (ver README).
    location /n8n/ {
        auth_basic "MailingAI n8n admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # n8n usa websockets para el editor en vivo.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend (SPA estatica) -- ultimo, catch-all.
    location / {
        proxy_pass http://frontend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
